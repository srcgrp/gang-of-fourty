<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idempotency Market</title>
  <meta name="author" content="Baran">
  <meta name="description" content="به‌زودی: بهترین میوه و سبزی محله!">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="card">
    <section class="product">
      <span class="badge">NEW</span>
      <div class="image-box">
         <img class="image" src="shopping-bag.JPG" alt="Market logo">
      </div>
      </section>
      <p class="category">Farm Products</p>
      <h2>Fresh Market Picks</h2>
      <p class="description">  A colorful selection of fresh, everyday essentials,
           carefully chosen for quality, flavor, and freshness.</p>
      <div class="rating">
        <span class="stars">★★★★★</span>
        <span class="reviews">(3,278)</span>
      </div>
      <div class="card-footer">
      <span class="price" lang="fa" dir="rtl">۵۰,۰۰۰ تومان</span>
      <button class="add-button">Add to bag</button>
      </div>
    </article>
  </main>
</body>
</html>
